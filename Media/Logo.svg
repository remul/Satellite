<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <title>Satellite</title>
  <!-- Emblem (see Emblem.svg) with the name below, on a dark card. -->
  <rect width="720" height="720" rx="36" fill="#141922"/>
  <g transform="translate(150 58) scale(0.82)">
    <path d="M116,24 L396,24 L488,116 L488,396 L396,488 L116,488 L24,396 L24,116 Z"
          fill="#e9b649" stroke="#3a2709" stroke-width="8" stroke-linejoin="round"/>
    <path d="M129.2,46 L382.8,46 L466,129.2 L466,382.8 L382.8,466 L129.2,466 L46,382.8 L46,129.2 Z"
          fill="#17625b" stroke="#3a2709" stroke-width="4" stroke-linejoin="round"/>
    <!-- The orbit. -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="#fff2d4" stroke-width="14"/>
    <!-- The minimap with the player arrow. -->
    <circle cx="256" cy="256" r="84" fill="#fff2d4"/>
    <path d="M256,206 L290,298 L256,276 L222,298 Z" fill="#17625b"/>
    <!-- Three buttons on the orbit, cut free from it by a field-coloured edge. -->
    <g fill="#fff2d4" stroke="#17625b" stroke-width="14">
      <circle cx="133.1" cy="170.0" r="30"/>
      <circle cx="106" cy="256" r="30"/>
      <circle cx="133.1" cy="342.0" r="30"/>
    </g>
  </g>
  <text x="360" y="600" text-anchor="middle" font-family="Copperplate, 'Copperplate Gothic Bold', Georgia, serif" font-weight="bold"
        font-size="96" letter-spacing="8" fill="#e9b649" stroke="#3a2709" stroke-width="3" paint-order="stroke">SATELLITE</text>
</svg>
