<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- The three buttons on the orbit of Satellite.svg, in the same place, on their own: their
       black outline cuts them free from the orbit. -->
  <g transform="translate(128 128) scale(0.66) translate(-256 -256)">
    <g fill="#000000">
      <circle cx="133.1" cy="170.0" r="40"/>
      <circle cx="106" cy="256" r="40"/>
      <circle cx="133.1" cy="342.0" r="40"/>
    </g>
    <g fill="#ffffff">
      <circle cx="133.1" cy="170.0" r="30"/>
      <circle cx="106" cy="256" r="30"/>
      <circle cx="133.1" cy="342.0" r="30"/>
    </g>
  </g>
</svg>
